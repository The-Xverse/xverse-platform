<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">X-Verse vNext conceptual metamodel</title>
  <desc id="desc">A domain-neutral conceptual model with System, Realization, and Experiment layers. Deployment binds logical System concepts to realization concepts, while Scenario exercises the System and gathers evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 18px Arial, sans-serif; fill: #475569; }
      .layer-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 16px Arial, sans-serif; fill: #334155; }
      .label { font: 14px Arial, sans-serif; fill: #475569; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="70" y="64" class="title">X-Verse vNext conceptual metamodel</text>
  <text x="70" y="96" class="subtitle">Proposed M1 architecture — semantic relationships only; no runtime or schema implementation</text>
  <rect x="55" y="145" width="700" height="780" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="85" y="190" class="layer-title">Logical System layer — what exists</text>
  <rect x="90" y="225" width="250" height="104" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="262" class="box-title">System</text><text x="115" y="290" class="box-text">logical composition boundary</text>
  <rect x="405" y="225" width="300" height="104" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="262" class="box-title">Scenario</text><text x="430" y="290" class="box-text">exercise and assessment intent</text>
  <rect x="90" y="390" width="190" height="145" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="112" y="425" class="box-title">Composition</text><text x="112" y="454" class="box-text">Component</text><text x="112" y="480" class="box-text">Node</text><text x="112" y="506" class="box-text">Device</text>
  <rect x="310" y="390" width="190" height="145" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="332" y="425" class="box-title">Physical roles</text><text x="332" y="454" class="box-text">Sensor</text><text x="332" y="480" class="box-text">Actuator</text><text x="332" y="506" class="box-text">Parameter</text>
  <rect x="530" y="390" width="175" height="145" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="552" y="425" class="box-title">Interaction</text><text x="552" y="454" class="box-text">Interface</text><text x="552" y="480" class="box-text">Endpoint</text><text x="552" y="506" class="box-text">Flow</text>
  <rect x="90" y="600" width="190" height="145" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="112" y="635" class="box-title">Connectivity</text><text x="112" y="664" class="box-text">Network</text><text x="112" y="690" class="box-text">Link</text><text x="112" y="716" class="box-text">Protocol</text>
  <rect x="310" y="600" width="190" height="145" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="332" y="635" class="box-title">Representation</text><text x="332" y="664" class="box-text">Model</text><text x="332" y="690" class="box-text">Artifact reference</text><text x="332" y="716" class="box-text">provenance</text>
  <rect x="530" y="600" width="175" height="145" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="552" y="635" class="box-title">Experiment</text><text x="552" y="664" class="box-text">Fault</text><text x="552" y="690" class="box-text">Observer</text><text x="552" y="716" class="box-text">Metric</text>
  <path d="M215 329 L185 390" class="line"/><path d="M215 329 L405 390" class="line"/><path d="M215 329 L620 390" class="line"/><path d="M555 329 L620 600" class="line"/>
  <text x="560" y="365" class="label">exercises</text>
  <rect x="845" y="145" width="700" height="780" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="875" y="190" class="layer-title">Realization layer — how it is made available</text>
  <rect x="885" y="250" width="265" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="910" y="286" class="box-title">Deployment</text><text x="910" y="315" class="box-text">environment-specific binding</text><text x="910" y="343" class="box-text">readiness and lifecycle intent</text>
  <rect x="1210" y="250" width="285" height="130" rx="12" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="1235" y="286" class="box-title">ExecutionTarget</text><text x="1235" y="315" class="box-text">process · container · virtual</text><text x="1235" y="343" class="box-text">emulator · remote · physical</text>
  <rect x="885" y="470" width="265" height="155" rx="12" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="910" y="506" class="box-title">Resources and artifacts</text><text x="910" y="535" class="box-text">Resource</text><text x="910" y="561" class="box-text">ComputeResource</text><text x="910" y="587" class="box-text">Artifact</text>
  <rect x="1210" y="470" width="285" height="155" rx="12" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="1235" y="506" class="box-title">Model execution</text><text x="1235" y="535" class="box-text">Simulator</text><text x="1235" y="561" class="box-text">TimeDomain</text><text x="1235" y="587" class="box-text">Clock</text>
  <rect x="885" y="705" width="610" height="105" rx="12" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="910" y="742" class="box-title">Evidence and maturity constraints</text><text x="910" y="771" class="box-text">provenance · explicit failure state · fidelity limits · observation evidence</text>
  <path d="M1150 315 L1210 315" class="line"/><path d="M1017 380 L1017 470" class="line"/><path d="M1353 380 L1353 470" class="line"/><path d="M1017 625 L1110 705" class="line"/><path d="M1353 625 L1280 705" class="line"/>
  <path d="M755 280 L885 280" class="dashed"/><text x="774" y="248" class="label">binds logical identity</text>
  <path d="M755 684 L885 684" class="dashed"/><text x="768" y="718" class="label">selects and observes</text>
  <rect x="55" y="970" width="1490" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="1007" class="box-title">Invariant</text><text x="85" y="1038" class="box-text">Deployment is the only bridge from logical identity to realization. Profiles extend concepts in their own namespace; they do not redefine core semantics.</text>
</svg>
