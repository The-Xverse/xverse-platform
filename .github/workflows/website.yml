name: Documentation website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: https://the-xverse.github.io
      BASE_PATH: /xverse-platform/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          python-version: '3.12'
      - name: Install documentation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y doxygen
          npm --prefix website ci --no-audit --no-fund
          uv sync --project website/reference --frozen
      - name: Record tool versions
        run: |
          node --version
          npm --version
          uv --version
          doxygen --version
          uv run --project website/reference --frozen python -m sphinx --version
      - name: Verify generation contracts
        run: npm --prefix website run test
      - name: Build and check root hosting
        run: BASE_PATH=/ npm --prefix website run build
      - name: Build and check GitHub project hosting
        run: npm --prefix website run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked documentation
        id: deployment
        uses: actions/deploy-pages@v4
